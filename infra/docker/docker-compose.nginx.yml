services:
  nginx:
    image: nginx:1.27-alpine
    container_name: siga-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - siga-net

  frontend:
    container_name: siga-frontend
    build:
      context: ../../
      dockerfile: apps/proyecto-siga-frontend/Dockerfile
    expose:
      - "3000"
    networks:
      - siga-net

  backend:
    container_name: siga-backend
    build:
      context: ../../
      dockerfile: apps/proyecto-siga-backend/Dockerfile
    env_file:
      - ../../apps/proyecto-siga-backend/.env
    expose:
      - "6001"
    networks:
      - siga-net

networks:
  siga-net:
    driver: bridge
