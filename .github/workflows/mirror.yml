name: Mirror to GitLab
on:
  push:
  create:
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-gitlab
      cancel-in-progress: true
    steps:
      - name: Clone bare desde GitHub
        run: |
          git clone --bare \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            repo
      - name: Push mirror a GitLab
        working-directory: repo
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push --mirror \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.buildwebs.online/despliegues/neurolab.git"
