name: Mirror to GitLab
on:
  push:
  create:
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-gitlab
      cancel-in-progress: true
    steps:
      - run: git clone --bare "https://github.com/${GITHUB_REPOSITORY}" repo
      - name: Push mirror a GitLab
        working-directory: repo
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push --mirror \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.buildwebs.online/despliegues/neurolab.git"
