# ─── GitLab CI/CD — Monorepo ProyectoSiga (Executor DOCKER, sin registry) ────
# Runner: docker executor sobre el host (38.225.54.181)
# Socket binding: cada job es un contenedor efímero que comparte el daemon
# de Docker del host, así las imágenes que construye quedan visibles para
# el `docker compose up -d` de producción (mismo daemon).
#
# REQUISITOS del runner (registrar con):
#   --executor docker
#   --docker-image alpine:latest
#   --docker-volumes "/var/run/docker.sock:/var/run/docker.sock"
#   --docker-volumes "/opt/neurolab:/opt/neurolab"
#   --docker-volumes "/cache"
#
# Variables CI/CD necesarias (masked + protected):
#   - DATABASE_URL        (job migrate)
# ─────────────────────────────────────────────────────────────────────────────

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"
  IMAGE_BACKEND: neurolab/backend
  IMAGE_FRONTEND: neurolab/frontend
  DEPLOY_DIR: /opt/neurolab
  # Node y Docker fijados aquí: cambiar versión = una sola línea.
  NODE_IMAGE: "node:22-alpine"
  DOCKER_IMAGE: "docker:27-cli"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main"

default:
  interruptible: true
  image: $NODE_IMAGE # imagen por defecto: Node 22
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
    # El cliente Prisma (@prisma/generated) es un artefacto NO versionado.
    # Sin esto, en la instalación limpia de CI faltan los tipos y el build/typecheck
    # falla con TS2307 (módulo no encontrado) y TS7006 (any implícito) en cascada.
    # `generate` no necesita DATABASE_URL; prisma.config.ts la resuelve de forma lazy.
    - pnpm prisma generate

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

stages:
  - quality
  - build
  - image
  - migrate
  - deploy
  - verify

# ─── Anclas de reglas ────────────────────────────────────────────────────────
.never_on_schedule: &never_on_schedule
  if: $CI_PIPELINE_SOURCE == "schedule"
  when: never

.only_main: &only_main
  if: $CI_COMMIT_BRANCH == "main"

# ─── QUALITY ─────────────────────────────────────────────────────────────────
# Heredan image: $NODE_IMAGE y before_script (corepack + pnpm install) del default.

typecheck:
  stage: quality
  script:
    - npx nx run-many -t typecheck --all
  rules:
    - *never_on_schedule
    - *only_main
    - changes: ["apps/**/*", "packages/**/*", "tsconfig*.json"]

lint:
  stage: quality
  script:
    - npx nx run-many -t lint --all -- --max-warnings 0
  rules:
    - *never_on_schedule
    - *only_main
    - changes: ["apps/**/*", "packages/**/*", ".eslintrc*", "eslint.config*"]

prisma:validate:
  stage: quality
  script:
    - pnpm prisma validate
    - pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
  rules:
    - *never_on_schedule
    - changes: ["prisma/**/*"]

# ─── BUILD (nx) ──────────────────────────────────────────────────────────────

build:backend:
  stage: build
  needs:
    - job: typecheck
      optional: true
    - job: lint
      optional: true
  script:
    - npx nx build proyecto-siga-backend --configuration=production
  artifacts:
    paths: ["apps/proyecto-siga-backend/dist"]
    expire_in: 1 hour
  rules:
    - *never_on_schedule
    - *only_main
    - changes:
        ["apps/proyecto-siga-backend/**/*", "packages/**/*", "prisma/**/*"]

build:frontend:
  stage: build
  needs:
    - job: typecheck
      optional: true
    - job: lint
      optional: true
  script:
    - npx nx build proyecto-siga-frontend
  artifacts:
    paths: ["apps/proyecto-siga-frontend/.next"]
    expire_in: 1 hour
  rules:
    - *never_on_schedule
    - *only_main
    - changes: ["apps/proyecto-siga-frontend/**/*", "packages/**/*"]

# ─── IMAGE (docker build via socket binding) ─────────────────────────────────
# Imagen del job: docker:27-cli. NO usa Node ni pnpm → before_script vacío.
# El `docker build` toca el daemon del host (socket montado), así que las
# imágenes resultantes quedan disponibles para el compose de producción.

.image_base:
  stage: image
  image: $DOCKER_IMAGE
  before_script: []
  rules:
    - *never_on_schedule
    - *only_main

image:backend:
  extends: .image_base
  needs:
    - job: build:backend
      optional: true
  script:
    - docker build -t $IMAGE_BACKEND:$CI_COMMIT_SHORT_SHA -t $IMAGE_BACKEND:latest -f apps/proyecto-siga-backend/Dockerfile .

image:frontend:
  extends: .image_base
  needs:
    - job: build:frontend
      optional: true
  script:
    - docker build -t $IMAGE_FRONTEND:$CI_COMMIT_SHORT_SHA -t $IMAGE_FRONTEND:latest -f apps/proyecto-siga-frontend/Dockerfile .

# ─── MIGRATE (Node + Prisma) ─────────────────────────────────────────────────
# Vuelve a la imagen Node porque ejecuta `prisma migrate deploy`.

migrate:
  stage: migrate
  needs: [image:backend]
  interruptible: false
  script:
    - pnpm prisma migrate deploy
  rules:
    - *never_on_schedule
    - if: $CI_COMMIT_BRANCH == "main"
      changes: ["prisma/migrations/**/*"]

# ─── DEPLOY (docker compose via socket binding) ──────────────────────────────
# El plugin de compose no viene en docker:27-cli oficial; lo añadimos con apk.
# `cd $DEPLOY_DIR` funciona porque /opt/neurolab está montado como volumen
# en el runner (ver REQUISITOS arriba).

deploy:
  stage: deploy
  image: $DOCKER_IMAGE
  interruptible: false
  before_script:
    - apk add --no-cache docker-cli-compose
  needs:
    - image:backend
    - image:frontend
    - job: migrate
      optional: true
  script:
    - cd $DEPLOY_DIR
    - export BACKEND_TAG=$CI_COMMIT_SHORT_SHA
    - export FRONTEND_TAG=$CI_COMMIT_SHORT_SHA
    - docker compose -f docker-compose.prod.yml up -d --remove-orphans
  environment:
    name: production
    url: https://neurolab.buildwebs.online
  rules:
    - *never_on_schedule
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false

# ─── VERIFY (solo curl) ──────────────────────────────────────────────────────
# Imagen mínima: curl ya viene incluido. Sin Node, sin docker.

verify:
  stage: verify
  image: curlimages/curl:latest
  before_script: []
  needs: [deploy]
  interruptible: false
  script:
    - |
      echo "Esperando que los servicios respondan..."
      for i in $(seq 1 30); do
        BACKEND_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://host.docker.internal:6001/api/health || echo "000")
        FRONTEND_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://host.docker.internal:3000 || echo "000")
        if [ "$BACKEND_CODE" = "200" ] && [ "$FRONTEND_CODE" = "200" ]; then
          HEALTH=$(curl -sf http://host.docker.internal:6001/api/health || echo "")
          if echo "$HEALTH" | grep -q "$CI_COMMIT_SHORT_SHA"; then
            echo "✓ Backend ($CI_COMMIT_SHORT_SHA) y Frontend respondieron 200"
          else
            echo "✓ Backend y Frontend respondieron 200"
            echo "⚠ /api/health no expone el SHA $CI_COMMIT_SHORT_SHA (¿COMMIT_SHA inyectado?). No bloquea."
          fi
          PUBLIC_CODE=$(curl -sf -o /dev/null -w "%{http_code}" https://neurolab.buildwebs.online/api/health || echo "000")
          if [ "$PUBLIC_CODE" = "200" ]; then
            echo "✓ URL pública https://neurolab.buildwebs.online respondió 200"
          else
            echo "⚠ URL pública respondió $PUBLIC_CODE (revisar DNS/TLS/proxy). No bloquea."
          fi
          exit 0
        fi
        echo "Intento $i/30 (backend=$BACKEND_CODE frontend=$FRONTEND_CODE) — esperando 5s..."
        sleep 5
      done
      echo "✗ Los servicios no respondieron 200 en 150s"
      exit 1
  rules:
    - *never_on_schedule
    - *only_main

# ─── CLEANUP (programado) ────────────────────────────────────────────────────

cleanup:images:
  stage: .post
  image: $DOCKER_IMAGE
  before_script: []
  variables:
    KEEP: "30"
  script:
    - |
      for repo in $IMAGE_BACKEND $IMAGE_FRONTEND; do
        echo "Limpiando $repo (conservando últimos $KEEP SHA + latest)..."
        docker images "$repo" --format '{{.Tag}} {{.ID}}' \
          | grep -v '^latest ' \
          | tail -n +"$((KEEP + 1))" \
          | awk '{print $2}' \
          | sort -u \
          | xargs -r docker rmi 2>/dev/null || true
      done
      docker image prune -f
      docker builder prune -af
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
